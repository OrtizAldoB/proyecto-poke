name: pokex
description: "Pokemon Collector - Login, Trivia, Collection & Trading"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  http: ^1.6.0
  sqflite: ^2.3.3+1
  path: ^1.9.0
  cached_network_image: ^3.4.1
  crypto: ^3.0.3
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - lib/img/logo2.png

flutter_launcher_icons:
  android: true
  image_path: "assets/images/logo2.png"